; Optional: build with PlatformIO instead of the Arduino IDE (both use the same sketch folder).
;   copy photo_gallery/secrets.example.h  to photo_gallery/secrets.h     (then edit)
;   copy photo_gallery/birthdays.example.h to photo_gallery/birthdays.h  (then edit)
;   pio run -t upload
[platformio]
src_dir = photo_gallery

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
; 8 MB flash. The sketch is about 2 MB with a full set of photos, so the default 1.2 MB app partition
; is too small: default_8MB.csv gives the app 3.3 MB. (Arduino IDE: choose a partition scheme with a ~3 MB app.)
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    bitbank2/JPEGDEC
